# k8s/ab/version-b.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-app-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitness
      version: v2
  template:
    metadata:
      labels:
        app: fitness
        version: v2
    spec:
      containers:
      - name: fitness-container
        image: 2024tm93612/aceest-fitness-app:release-39
        ports:
        - containerPort: 5000