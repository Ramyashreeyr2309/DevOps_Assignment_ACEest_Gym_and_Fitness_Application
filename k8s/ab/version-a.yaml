# k8s/ab/version-a.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-app-v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitness
      version: v1
  template:
    metadata:
      labels:
        app: fitness
        version: v1
    spec:
      containers:
      - name: fitness-container
        image: 2024tm93612/aceest-fitness-app:release-38
        ports:
        - containerPort: 5000