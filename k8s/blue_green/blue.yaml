apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-app-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitness
      version: blue
  template:
    metadata:
      labels:
        app: fitness
        version: blue
    spec:
      containers:
      - name: fitness-container
        image: 2024tm93612/aceest-fitness-app:release-39
        ports:
        - containerPort: 5000